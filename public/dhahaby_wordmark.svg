<svg xmlns="http://www.w3.org/2000/svg" width="420" height="72" viewBox="0 0 420 72" role="img" aria-label="DHAHABY">
  <title>DHAHABY</title>
  <defs>
    <!-- Brand bronze, centred on #9A5B0C (logo-mark.svg) -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C98A2E"/>
      <stop offset="0.5" stop-color="#9A5B0C"/>
      <stop offset="1" stop-color="#6E3F06"/>
    </linearGradient>
    <!-- Moving shine band -->
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-420" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFE7C2" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animate attributeName="x1" values="-420;420;420" keyTimes="0;0.6;1" dur="3.5s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;840;840" keyTimes="0;0.6;1" dur="3.5s" begin="0.8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="52" font-weight="800"
     letter-spacing="10" text-anchor="middle">
    <!-- Solid wordmark; a shine band sweeps across it on a loop -->
    <g>
      <text x="215" y="54" fill="url(#gold)">DHAHABY</text>
      <text x="215" y="54" fill="url(#shine)">DHAHABY</text>
    </g>
  </g>
</svg>
